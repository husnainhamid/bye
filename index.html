
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Freeze Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: lime;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            cursor: none;
            user-select: none;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div>
            <p>System Freeze Detected...</p>
            <p>Attempting Recovery...</p>
        </div>
    </div>

    <script>
        document.addEventListener('click', () => {
            const overlay = document.getElementById('overlay');
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            overlay.style.pointerEvents = 'auto';

            // Fake disable keyboard and mouse
            function blockEvent(e) {
                e.stopPropagation();
                e.preventDefault();
                return false;
            }
            window.addEventListener('keydown', blockEvent, true);
            window.addEventListener('keyup', blockEvent, true);
            window.addEventListener('keypress', blockEvent, true);
            window.addEventListener('mousemove', blockEvent, true);
            window.addEventListener('mousedown', blockEvent, true);

            setTimeout(() => {
                // Release after 30 seconds
                window.removeEventListener('keydown', blockEvent, true);
                window.removeEventListener('keyup', blockEvent, true);
                window.removeEventListener('keypress', blockEvent, true);
                window.removeEventListener('mousemove', blockEvent, true);
                window.removeEventListener('mousedown', blockEvent, true);

                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }

                overlay.innerHTML = '<p>😂 Gotcha! Prank over.</p>';
                overlay.style.cursor = 'default';
            }, 30000);
        }, { once: true });
    </script>
</body>
</html>
